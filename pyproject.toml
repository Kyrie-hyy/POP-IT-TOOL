[project]
name = "pop-it-toolbox"
version = "3.0.0"
description = "一站式企业 IT 运维工具箱（Windows / PySide6）"
authors = [
    {name = "POP IT Team", email = "it@popmart.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
full = [
    "psutil>=5.9",
    "pywin32>=306",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pyinstaller]
name = "POP-IT-Toolbox"
console = false
uac_admin = true
